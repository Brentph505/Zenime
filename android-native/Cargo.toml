[package]
name = "zenime_native"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "zenime_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zenime-native"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
urlencoding = "2.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
